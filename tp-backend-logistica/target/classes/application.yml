server: 
  port: 8081 

spring:
  application:
    name: tp-backend-logistica
  datasource:
    url: jdbc:h2:file:./data/tpiDb-logistica
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always

  jackson:
    time-zone: America/Argentina/Buenos_Aires

springdoc: 
  swagger-ui: 
    path: /swagger-ui.html 

google: 
  maps: 
    apikey: AIzaSyDAXcMocfHcz1ipvHOYP4L9iBqTfw9VroE

distancias:
  provider: ${DISTANCIAS_PROVIDER:osrm}

osrm:
  api:
    url: ${OSRM_API_URL:https://router.project-osrm.org}

servicio:
  ciudades:
    url: ${SERVICIO_CIUDADES_URL:http://localhost:8082/api/pedidos}
  depositos:
    url: ${SERVICIO_DEPOSITOS_URL:http://localhost:8082/api/pedidos}
  camiones:
    url: ${SERVICIO_CAMIONES_URL:http://localhost:8082/api/pedidos}
  contenedores:
    url: ${SERVICIO_CONTENEDORES_URL:http://localhost:8082/api/pedidos}
  pedidos:
    url: ${SERVICIO_PEDIDOS_URL:http://localhost:8082/api/pedidos}
